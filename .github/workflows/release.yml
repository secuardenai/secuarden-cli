name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests before publishing
        run: go test ./...

      - name: Verify the release command surface
        run: |
          go build -o "$RUNNER_TEMP/secuarden" ./cmd/secuarden
          python3 scripts/check-release-commands.py "$RUNNER_TEMP/secuarden"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
