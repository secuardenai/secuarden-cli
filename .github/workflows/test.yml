name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Run tests and validate JSON fixtures
        env:
          GOPROXY: "off"
        run: go test ./...
